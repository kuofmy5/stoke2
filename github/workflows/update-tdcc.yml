```yaml
name: Update TDCC data

 

on:
  schedule:
    # GitHub cron 使用 UTC；02:17 UTC 約為台灣時間 10:17
    - cron: "17 2 * * *"
  workflow_dispatch:

 

permissions:
  contents: write

 

jobs:
  update-data:
    runs-on: ubuntu-latest

 

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

 

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

 

      - name: Install dependencies
        run: pip install -r requirements.txt

 

      - name: Download and update TDCC history
        run: python scripts/update_tdcc.py

 

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

 

          git add data/tdcc_history.json

 

          if git diff --cached --quiet; then
            echo "沒有新資料，不建立 commit。"
          else
            git commit -m "Update TDCC shareholder data"
            git push
          fi
          ```
